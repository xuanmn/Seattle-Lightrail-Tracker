<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1424"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a854"/>
      <stop offset="50%" stop-color="#008542"/>
      <stop offset="100%" stop-color="#0072ce"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Glowing Sound Transit Rail Track Curve -->
  <path d="M 32 148 Q 96 148 160 148" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 44 148 Q 96 148 148 148" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Modern Streamlined Train Body -->
  <rect x="48" y="38" width="96" height="96" rx="22" fill="#0f172a" stroke="url(#lineGrad)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Windshield / Front Window -->
  <path d="M 58 56 Q 96 50 134 56 L 134 78 Q 96 74 58 78 Z" fill="#38bdf8" opacity="0.95"/>
  <path d="M 96 52 L 96 76" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Headlights -->
  <circle cx="68" cy="110" r="7" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="124" cy="110" r="7" fill="#ffffff" filter="url(#glow)"/>

  <!-- Line Number Indicator Bullets -->
  <circle cx="84" cy="94" r="5" fill="#008542"/>
  <circle cx="108" cy="94" r="5" fill="#0072ce"/>
</svg>
