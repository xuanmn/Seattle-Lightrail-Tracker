<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="lineGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a854"/>
      <stop offset="50%" stop-color="#008542"/>
      <stop offset="100%" stop-color="#0072ce"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Sound Transit Rail Track Curve -->
  <path d="M 85 395 Q 256 395 427 395" stroke="#1e293b" stroke-width="20" stroke-linecap="round"/>
  <path d="M 115 395 Q 256 395 397 395" stroke="url(#lineGrad512)" stroke-width="10" stroke-linecap="round" filter="url(#glow512)"/>

  <!-- Modern Streamlined Train Body -->
  <rect x="128" y="100" width="256" height="256" rx="58" fill="#0f172a" stroke="url(#lineGrad512)" stroke-width="9" filter="url(#glow512)"/>

  <!-- Windshield / Front Window -->
  <path d="M 155 150 Q 256 134 357 150 L 357 210 Q 256 198 155 210 Z" fill="#38bdf8" opacity="0.95"/>
  <path d="M 256 140 L 256 204" stroke="#0f172a" stroke-width="6"/>

  <!-- Headlights -->
  <circle cx="180" cy="295" r="18" fill="#ffffff" filter="url(#glow512)"/>
  <circle cx="332" cy="295" r="18" fill="#ffffff" filter="url(#glow512)"/>

  <!-- Line Number Indicator Bullets -->
  <circle cx="225" cy="250" r="14" fill="#008542"/>
  <circle cx="287" cy="250" r="14" fill="#0072ce"/>
</svg>
